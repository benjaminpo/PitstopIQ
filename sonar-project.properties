sonar.organization=benjaminpo-gh
sonar.projectKey=benjaminpo_PitstopIQ
sonar.projectName=PitstopIQ

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/fonts/**,**/*.ico,**/*.svg

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Match Vitest coverage include list (see vitest.config.ts).
# Files missing from LCOV are treated as 0% covered — exclude everything
# outside the allowlist so UI / API / infra changes don't tank new-code coverage.
sonar.coverage.inclusions=app/lib/detourCalculator.ts,app/lib/brandCategory.ts,app/lib/routing.ts,app/lib/tripUrl.ts,app/lib/baselinePrice.ts,app/lib/mapsLinks.ts,app/lib/utils.ts,app/lib/freshness.ts,app/lib/adsense.ts,app/lib/locationHistory.ts,app/lib/fuelFinderCsv.ts,app/lib/fuelPriceParse.ts
sonar.coverage.exclusions=app/components/**,app/api/**,app/**/*.tsx,app/**/*.css,app/lib/db.ts,app/lib/store.ts,app/lib/auth.ts,app/lib/auth-client.ts,app/lib/auth-url.ts,app/lib/fuelApiAdapter.ts,app/lib/fuelFinderClient.ts,app/lib/fuelDatasetCache.ts,app/lib/geolocation.ts,app/lib/placeSearch.ts,app/lib/stationContributions.ts,app/lib/types.ts,app/ads.txt/**,app/login/**,app/register/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
