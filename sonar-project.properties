sonar.organization=benjaminpo-gh
sonar.projectKey=benjaminpo_PitstopIQ
sonar.projectName=PitstopIQ

sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/fonts/**,**/*.ico,**/*.svg

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Match Vitest coverage include/exclude (see vitest.config.ts).
# Files missing from LCOV are treated as 0% covered, so scope coverage to the
# same set Vitest measures.
sonar.coverage.inclusions=app/lib/**/*.ts,app/manifest.ts,app/robots.ts,app/sitemap.ts
sonar.coverage.exclusions=**/*.test.ts,app/lib/db.ts,app/lib/auth.ts,app/lib/auth-client.ts,app/lib/store.ts,app/lib/types.ts,app/lib/priceWatchTypes.ts,app/lib/fuelDatasetCache.ts,app/lib/geolocation.ts,app/lib/loadBrands.ts,app/lib/loadLocations.ts,app/lib/fuelFinderClient.ts,app/lib/priceWatches.ts,app/lib/stationContributions.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
